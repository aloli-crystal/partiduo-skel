name: partiduo-skel
version: 0.1.0

description: |
  Extension de référence de Partiduo (ADR-003 D8), successeur de l'extension
  SKEL d'origine : manifeste, permission, menu, modèle et migration, abonnement à
  entry.posted, contrat Skel::Api et page montée sous /ext/SKEL/ par
  partiduo-ui-bulma. Chaque portage d'extension part de ce dépôt.

authors:
  - Philippe Nénert <it+claude.ai@aloli.fr>

crystal: ">= 1.19.1"

license: AGPL-3.0-or-later

targets:
  partiduo-skel-manage:
    main: manage.cr

dependencies:
  # Le cœur : registre, événements et contrat Partiduo::Api.
  partiduo:
    path: ../partiduo-app
  marten:
    path: ../../marten

development_dependencies:
  # L'interface qui monte ui/bulma/ : nécessaire aux specs et à manage.cr ;
  # la distribution l'apporte elle-même.
  partiduo-ui-bulma:
    path: ../partiduo-ui-bulma
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
