#
# Essai temporaire : quelle édition de liens produit un binaire de specs
# exécutable sous Linux (« symbol lookup error » avec ld.bfd) ? À supprimer
# une fois la CI réparée.
name: Essai édition de liens

on:
  push:
    branches: [development]
  workflow_dispatch:

env:
  CRYSTAL_VERSION: 1.19.1
  SKIP_MARTEN_CLI_PRECOMPILATION: 1

jobs:
  essai:
    name: Essai (${{ matrix.variante }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variante: lld
            flags: --no-debug --threads 1 --link-flags=-fuse-ld=lld
          - variante: sans-export-dynamique
            flags: --no-debug --threads 1 --link-flags=-Wl,--no-export-dynamic
          - variante: avec-debogage
            flags: --threads 1
          - variante: gold
            flags: --no-debug --threads 1 --link-flags=-fuse-ld=gold
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: partiduo
          POSTGRES_PASSWORD: partiduo
          POSTGRES_DB: partiduo_test
        options: >-
          --health-cmd "pg_isready -U partiduo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # En CI seulement, PostgreSQL est un service joignable en TCP.
      DATABASE_URL: postgres://partiduo:partiduo@localhost:5432/partiduo_test
    steps:
      - uses: actions/checkout@v4
      - name: Mémoire d'échange (la compilation des specs dépasse 6 Go)
        run: |
          sudo fallocate -l 12G /swap-ci && sudo chmod 600 /swap-ci
          sudo mkswap /swap-ci && sudo swapon /swap-ci && free -h
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1
      - name: Bibliothèques de compilation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libyaml-dev libssl-dev libgmp-dev libxml2-dev libpcre2-dev lld binutils
      - name: Dépendances path (cœur, interface, shards maison)
        run: scripts/ci-checkout-deps.sh
      - name: Shards
        run: shards install
      - name: Specs
        run: crystal spec --order random ${{ matrix.flags }}
